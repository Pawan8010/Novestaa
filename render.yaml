# Render Blueprint for Novesta (https://novesta.online)
services:
  - type: web
    name: novesta-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.18.0
      - key: APP_URL
        value: https://novesta.online
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: hello@novesta.online
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Novesta <hello@novesta.online>
      - key: CONTACT_TO_EMAIL
        value: hello@novesta.online
      - key: CONTACT_BACKUP_EMAIL
        value: rajputpawan9765@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Novesta <hello@novesta.online>
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
